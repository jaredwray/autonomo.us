<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>@autonomo.us/logo — demo</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: "Helvetica Neue", system-ui, sans-serif;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				color: #aeb8d4;
				background:
					radial-gradient(
						120% 90% at 50% 0%,
						#0e1c40 0%,
						#0a1430 45%,
						#060b1d 100%
					);
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 40px;
				padding: 56px 24px 80px;
			}
			.hero {
				width: min(620px, 92vw);
			}
			.controls {
				display: flex;
				flex-wrap: wrap;
				gap: 14px;
				align-items: center;
				justify-content: center;
			}
			button,
			label {
				font-size: 13px;
				letter-spacing: 0.04em;
				color: #c7d2f0;
			}
			button {
				background: rgba(120, 160, 255, 0.1);
				border: 1px solid rgba(120, 160, 255, 0.3);
				border-radius: 999px;
				padding: 9px 18px;
				cursor: pointer;
				transition: background 0.2s;
			}
			button:hover {
				background: rgba(120, 160, 255, 0.22);
			}
			input[type="range"] {
				accent-color: #3b82f6;
			}
			.tiles {
				display: flex;
				flex-wrap: wrap;
				gap: 22px;
				justify-content: center;
			}
			.tile {
				width: 240px;
				border-radius: 16px;
				padding: 22px;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 10px;
			}
			.tile span {
				font-size: 11px;
				letter-spacing: 0.18em;
				text-transform: uppercase;
				opacity: 0.6;
			}
			.tile--light {
				background: #eef1fa;
			}
			.tile--checker {
				background-color: #1b2340;
				background-image:
					linear-gradient(45deg, #283255 25%, transparent 25%),
					linear-gradient(-45deg, #283255 25%, transparent 25%),
					linear-gradient(45deg, transparent 75%, #283255 75%),
					linear-gradient(-45deg, transparent 75%, #283255 75%);
				background-size: 22px 22px;
				background-position:
					0 0,
					0 11px,
					11px -11px,
					-11px 0;
			}
		</style>
	</head>
	<body>
		<div class="hero">
			<autonomous-logo id="hero" animation="loop"></autonomous-logo>
		</div>

		<div class="controls">
			<button id="replay">Replay intro</button>
			<label>
				Speed
				<input id="speed" type="range" min="0.4" max="2" step="0.1" value="1" />
				<span id="speedVal">1.0×</span>
			</label>
			<label>
				<input id="wordmark" type="checkbox" checked /> wordmark
			</label>
		</div>

		<div class="tiles">
			<div class="tile tile--light">
				<autonomous-logo width="190"></autonomous-logo>
				<span>on light</span>
			</div>
			<div class="tile tile--checker">
				<autonomous-logo width="190" show-wordmark="false"></autonomous-logo>
				<span>transparent · mark only</span>
			</div>
		</div>

		<script type="module">
			import { defineAutonomousLogo } from "/dist/index.mjs";
			defineAutonomousLogo();

			const hero = document.getElementById("hero");
			document
				.getElementById("replay")
				.addEventListener("click", () => hero.replay());

			const speed = document.getElementById("speed");
			const speedVal = document.getElementById("speedVal");
			speed.addEventListener("input", () => {
				speedVal.textContent = `${Number(speed.value).toFixed(1)}×`;
				hero.setAttribute("speed", speed.value);
			});

			document
				.getElementById("wordmark")
				.addEventListener("change", (e) => {
					hero.setAttribute("show-wordmark", String(e.target.checked));
				});
		</script>
	</body>
</html>
