server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	location / {
		try_files $uri $uri/ /index.html;
	}

	# Proxy the gateway API so the dashboard is same-origin in compose.
	location /v1/ {
		proxy_pass http://api:3000;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		# SSE streaming for POST /v1/chat with stream: true.
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 300s;
	}

	location /health {
		proxy_pass http://api:3000;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
	}
}
