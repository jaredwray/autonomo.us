name: tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.23.5', '24']
    services:
      mongo:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: autonomous
          MONGO_INITDB_ROOT_PASSWORD: autonomous
          # Use TCMalloc's thread caches to avoid the hosted runner kernel's
          # rseq incompatibility: https://jira.mongodb.org/browse/SERVER-121912
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet -u autonomous -p autonomous --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: corepack enable
      - run: sfw pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - name: Check development Worker config
        # The dashboard assets come from core/ux/dist, built by pnpm build above.
        run: pnpm exec wrangler deploy -c core/server/wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/server"
      # Suites that need MongoDB default to the service above. Leaving
      # MONGODB_URI unset keeps createServer() in-memory for the other tests.
      - run: pnpm test:ci
      - name: Exercise the API in the Workers runtime
        run: pnpm test:worker

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - run: docker compose build server
