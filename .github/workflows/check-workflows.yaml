name: Check Workflows

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    # Job-level permissions cannot use expressions. Fork and Dependabot PRs
    # already get a read-only token; skip SARIF upload there so the job does
    # not fail.
    permissions:
      contents: read
      actions: read
      security-events: write # SARIF upload to code scanning (same-repo only)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: ${{ !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
          annotations: ${{ github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]' }}
