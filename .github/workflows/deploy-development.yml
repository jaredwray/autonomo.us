name: deploy-development

# Publishes the development environment to Cloudflare Workers on main.
#   autonomous-ux-development  → https://dev.autonomo.us
#   autonomous-api-development → https://dev-api.autonomo.us
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN  — required. Account → Workers Scripts → Edit,
#                           Zone → Workers Routes → Edit, Zone → DNS → Edit.
#                           Scope the token to the account that owns autonomo.us
#                           and to that zone.
#   CLOUDFLARE_ACCOUNT_ID — required. The same account.
#
# MongoDB is not created here. After the first deploy, set it on the API worker:
#   pnpm exec wrangler secret put MONGODB_URL -c core/api/wrangler.jsonc
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy-development
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
      url: https://dev.autonomo.us
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare
      - name: Install Dependencies
        run: sfw pnpm install --frozen-lockfile
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID before deploying."
            exit 1
          fi
      - name: Build the dashboard
        run: pnpm --filter @autonomo.us/ux... build
        env:
          VITE_API_URL: https://dev-api.autonomo.us
      - name: Deploy development Workers
        run: pnpm deploy:development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
