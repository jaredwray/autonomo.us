name: deploy-dev

# Publishes the dashboard to Cloudflare Workers when commits land on main.
# The development environment is https://dev.autonomo.us (Worker autonomo-dev).
#
# Repository secrets:
#   CLOUDFLARE_API_TOKEN  — required. Account → Workers Scripts → Edit,
#                           Zone → Workers Routes → Edit, Zone → DNS → Edit.
#                           Scope the token to the account that owns autonomo.us
#                           and to that zone.
#   CLOUDFLARE_ACCOUNT_ID — required. The same account.
#   DEV_API_URL           — optional. Baked in as VITE_API_URL. When unset, the
#                           dashboard calls same-origin /v1. A cross-origin API
#                           must allow https://dev.autonomo.us via CORS_ORIGIN.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy development
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
      url: https://dev.autonomo.us
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare
      - name: Install Dependencies
        run: sfw pnpm install --frozen-lockfile
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID before deploying."
            exit 1
          fi
      - name: Build the dashboard
        run: pnpm --filter @autonomo.us/ux... build
        env:
          VITE_API_URL: ${{ secrets.DEV_API_URL }}
      - name: Deploy to Cloudflare Workers
        run: pnpm deploy:dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
